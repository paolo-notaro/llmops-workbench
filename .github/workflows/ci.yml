name: CI and Cloud Run delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install poetry==2.2.1
          poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest
      - name: Test deployment safeguard
        run: |
          python -m pip install pytest==9.1.1 -r deploy/billing_shutdown/requirements.txt
          PYTHONPATH=deploy/billing_shutdown python -m pytest deploy/billing_shutdown/test_main.py
      - name: Validate package metadata
        run: |
          poetry run pip check
          poetry check
      - name: Build container
        run: docker build --tag llmops-workbench:ci .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUD_RUN_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Configure Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Validate runtime identity
        run: |
          gcloud iam service-accounts describe "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy llmops-workbench \
            --quiet \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --port 8000 \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 20 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 60 \
            --cpu-throttling \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars LLM_PROVIDER=mock,LOG_LEVEL=INFO \
            --labels app=llmops-workbench,environment=demo \
            --description "Public LLMOps evaluation and RAG observability workbench"
